<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Codex 会话清理器</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f5f7; --panel:rgba(255,255,255,.88); --text:#17191d; --muted:#6e737b; --line:rgba(23,25,29,.11); --accent:#1677ff; --danger:#d92d20; --danger-bg:#fff0ee; --shadow:0 14px 36px rgba(24,30,42,.10); }
    @media (prefers-color-scheme:dark) { :root { --bg:#17181a; --panel:rgba(34,35,38,.9); --text:#f5f6f7; --muted:#a7abb1; --line:rgba(255,255,255,.12); --danger-bg:#421c1a; --shadow:0 14px 36px rgba(0,0,0,.28); } }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 20% 0%,rgba(22,119,255,.11),transparent 30%),var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif; }
    button,input,select { font:inherit; }
    button { color:inherit; }
    .app { max-width:1340px; margin:0 auto; padding:18px 18px 36px; }
    .header-actions { display:flex; flex-shrink:0; align-items:center; justify-content:flex-end; gap:8px; }
    .language-switch { display:inline-flex; flex-shrink:0; padding:2px; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
    .language-switch button { min-width:42px; border:0; border-radius:7px; padding:3px 8px; background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap; }
    .language-switch button.active { background:var(--text); color:var(--bg); }
    header { display:flex; gap:16px; align-items:center; justify-content:space-between; margin-bottom:10px; }
    h1 { font-size:23px; letter-spacing:-.02em; margin:0 0 2px; }
    .subtitle,.muted { color:var(--muted); }
    .shield { border:1px solid var(--line); background:var(--panel); padding:5px 9px; border-radius:999px; white-space:nowrap; }
    .toolbar { position:sticky; top:0; z-index:3; display:grid; grid-template-columns:minmax(220px,1fr) auto 112px 124px auto; align-items:center; gap:7px 8px; margin-bottom:10px; padding:8px 9px; border:1px solid var(--line); border-radius:16px; background:var(--panel); backdrop-filter:blur(18px); box-shadow:var(--shadow); }
    .search,.date-select,.tag-select,.date-input { border:1px solid var(--line); background:transparent; color:var(--text); border-radius:10px; padding:7px 9px; outline:none; }
    .search:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(22,119,255,.13); }
    .segments { display:flex; padding:2px; border:1px solid var(--line); border-radius:11px; white-space:nowrap; }
    .segments button { border:0; background:transparent; border-radius:8px; padding:5px 8px; cursor:pointer; white-space:nowrap; }
    .segments button.active { background:var(--text); color:var(--bg); }
    .date-select,.tag-select { min-width:0; width:100%; cursor:pointer; }
    .date-select option,.tag-select option { color:#17191d; background:#fff; }
    .custom-dates { grid-column:1 / -1; display:flex; align-items:center; justify-content:flex-end; gap:8px; padding-top:2px; color:var(--muted); }
    .custom-dates[hidden] { display:none; }
    .btn { border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:7px 10px; cursor:pointer; }
    .btn:hover:not(:disabled) { border-color:rgba(22,119,255,.5); }
    .btn:disabled { opacity:.42; cursor:not-allowed; }
    .btn.danger { color:var(--danger); border-color:rgba(217,45,32,.3); background:var(--danger-bg); }
    .summary { grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0; padding-top:6px; border-top:1px solid var(--line); white-space:nowrap; }
    .actions { display:flex; gap:6px; align-items:center; }
    .list { display:grid; gap:10px; }
    .card { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:flex-start; padding:15px; border:1px solid var(--line); border-radius:15px; background:var(--panel); box-shadow:0 5px 18px rgba(20,25,34,.04); }
    .card:hover { border-color:rgba(22,119,255,.28); }
    .card.current { box-shadow:inset 3px 0 0 var(--accent); }
    .card input[type=checkbox] { width:17px; height:17px; margin-top:3px; accent-color:var(--accent); }
    .title-row { display:flex; align-items:center; gap:7px; min-width:0; }
    .title { font-size:15px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .badge { display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:999px; padding:1px 7px; font-size:11px; color:var(--muted); white-space:nowrap; }
    .badge.current { color:var(--accent); border-color:rgba(22,119,255,.35); }
    .badge.warning { color:#b54708; border-color:rgba(181,71,8,.35); background:rgba(255,171,64,.10); }
    .preview { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px; }
    .meta { display:flex; flex-wrap:wrap; gap:6px 13px; margin-top:9px; color:var(--muted); font-size:12px; }
    .path { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
    .side { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
    .link { border:0; background:transparent; color:var(--accent); padding:2px; cursor:pointer; }
    .files { grid-column:2 / 4; border-top:1px solid var(--line); padding-top:11px; }
    .files h4 { margin:8px 0 5px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    .file-row { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line); }
    .empty { text-align:center; padding:52px 16px; color:var(--muted); border:1px dashed var(--line); border-radius:15px; }
    .notice { margin-top:13px; padding:10px 12px; color:var(--muted); border:1px solid var(--line); border-radius:11px; }
    .toast { position:fixed; right:18px; bottom:18px; max-width:400px; z-index:20; padding:11px 14px; border-radius:11px; background:var(--text); color:var(--bg); box-shadow:var(--shadow); opacity:0; transform:translateY(10px); pointer-events:none; transition:.18s ease; }
    .toast.show { opacity:1; transform:translateY(0); }
    dialog { width:min(520px,calc(100vw - 28px)); border:1px solid var(--line); border-radius:18px; padding:0; color:var(--text); background:var(--panel); box-shadow:0 26px 90px rgba(0,0,0,.35); }
    dialog::backdrop { background:rgba(0,0,0,.46); backdrop-filter:blur(3px); }
    .modal { padding:20px; }
    .modal h2 { margin:0 0 6px; font-size:19px; }
    .danger-box { margin:14px 0; border:1px solid rgba(217,45,32,.28); background:var(--danger-bg); border-radius:11px; padding:10px 12px; color:var(--danger); }
    .confirm { width:100%; color:var(--text); background:transparent; border:1px solid var(--line); border-radius:10px; padding:10px; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
    @media (max-width:960px) { .toolbar { grid-template-columns:minmax(160px,1fr) auto 112px 124px auto; } }
    @media (max-width:720px) { .app { padding-top:14px; } .toolbar { grid-template-columns:1fr; position:static; } header { align-items:flex-start; flex-direction:column; } .summary { align-items:flex-start; flex-direction:column; } .card { grid-template-columns:auto minmax(0,1fr); } .side { grid-column:2; align-items:flex-start; flex-direction:row; } .files { grid-column:2; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div><h1 id="pageTitle">Codex 会话清理器</h1><div id="pageSubtitle" class="subtitle">看清项目与文件线索，再归档或永久删除。</div></div>
      <div class="header-actions">
        <div id="shield" class="shield">🔒 当前管理会话受保护</div>
        <div id="languageSwitch" class="language-switch" role="group" aria-label="语言选择">
          <button type="button" data-locale="zh">中文</button>
          <button type="button" data-locale="en">EN</button>
        </div>
      </div>
    </header>
    <section id="toolbar" class="toolbar" aria-label="会话筛选">
      <input id="search" class="search" type="search" placeholder="搜索标题、ID、标签或项目路径…">
      <div class="segments" role="tablist">
        <button data-scope="active">当前</button><button data-scope="archived">已归档</button><button data-scope="all" class="active">全部</button>
      </div>
      <select id="tagFilter" class="tag-select" aria-label="按类别标签筛选">
        <option value="">标签</option>
      </select>
      <select id="datePreset" class="date-select" aria-label="按最后更新时间筛选">
        <option value="all">日期</option>
        <option value="within_1_day">1 天内</option>
        <option value="within_1_week">1 周内</option>
        <option value="within_1_month">1 个月内</option>
        <option value="older_than_3_months">3 个月前（更早）</option>
        <option value="older_than_1_month">1 个月前（更早）</option>
        <option value="older_than_1_week">1 周前（更早）</option>
        <option value="custom">自定义日期</option>
      </select>
      <button id="refresh" class="btn">刷新</button>
      <div id="customDates" class="custom-dates" hidden>
        <span>最后更新时间</span>
        <input id="customStart" class="date-input" type="date" aria-label="开始日期">
        <span>至</span>
        <input id="customEnd" class="date-input" type="date" aria-label="结束日期">
      </div>
      <div class="summary">
        <div><span id="count">正在读取…</span> <span id="selection" class="muted"></span></div>
        <div class="actions">
          <button id="archive" class="btn" disabled>归档所选</button>
          <button id="delete" class="btn danger" disabled>永久删除所选</button>
        </div>
      </div>
    </section>
    <section id="list" class="list" aria-live="polite"></section>
    <div id="notice" class="notice">删除会话不会删除项目文件。文件列表只是从会话记录提取的修改/引用线索；共享插件缓存、模型缓存、认证信息和全局配置不在本插件清理范围内。</div>
  </main>

  <dialog id="deleteDialog">
    <form method="dialog" class="modal" id="deleteForm">
      <h2 id="deleteHeading">永久删除所选会话？</h2>
      <div id="deleteDescription" class="muted">Codex 会一并删除这些会话的派生会话和持久化元数据。此操作不可撤销。</div>
      <div id="deleteDanger" class="danger-box">项目文件不会被删除，但会话内容将无法从 Codex 恢复。</div>
      <label id="confirmationLabel" for="confirmation"></label>
      <input id="confirmation" class="confirm" autocomplete="off" placeholder="删除">
      <div class="modal-actions">
        <button id="cancelDelete" type="button" class="btn">取消</button>
        <button id="confirmDelete" value="default" class="btn danger" disabled>确认永久删除</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>

  <script>
    (() => {
      const I18N = {
        zh: {
          htmlLang: 'zh-CN', dateLocale: 'zh-CN', title: 'Codex 会话清理器', languageSelector: '语言选择', switchChinese: '切换为中文', switchEnglish: '切换为英文',
          subtitle: '看清项目与文件线索，再归档或永久删除。', shield: '🔒 当前管理会话受保护', toolbar: '会话筛选',
          search: '搜索标题、ID、标签或项目路径…', scopeActive: '当前', scopeArchived: '已归档', scopeAll: '全部',
          tag: '标签', tagAria: '按类别标签筛选', date: '日期', dateAria: '按最后更新时间筛选',
          withinDay: '1 天内', withinWeek: '1 周内', withinMonth: '1 个月内', older3Months: '3 个月前（更早）',
          olderMonth: '1 个月前（更早）', olderWeek: '1 周前（更早）', custom: '自定义日期', refresh: '刷新',
          lastUpdated: '最后更新时间', to: '至', startDate: '开始日期', endDate: '结束日期',
          archiveSelected: '归档所选', deleteSelected: '永久删除所选',
          notice: '删除会话不会删除项目文件。文件列表只是从会话记录提取的修改/引用线索；共享插件缓存、模型缓存、认证信息和全局配置不在本插件清理范围内。',
          requestTimeout: '请求超时', toolFailed: '工具调用失败', requestFailed: '请求失败', unknownTime: '时间未知',
          sessions: count => `${count} 个会话`, selected: count => `· 已选 ${count}`, loading: '正在读取会话…', empty: '没有符合条件的会话',
          protected: '当前管理会话受保护', ephemeralProtected: '临时会话不可删除', selectSession: '选择会话',
          busy: '使用中', busyHint: '该会话正被 Codex 打开，只能在侧边栏归档或删除',
          currentSession: '当前会话', archived: '已归档', ephemeral: '临时', unknownProject: '项目路径未知',
          branch: value => `分支 ${value}`, descendants: count => `${count} 个派生会话`, blockers: count => `${count} 个引用分叉阻止源会话删除`, source: id => `引用源 ${id}`,
          collapseFiles: '收起文件', inspectFiles: '查看文件', copyProject: '复制项目路径', loadingFiles: '正在读取会话文件线索…',
          fileNote: '文件线索来自会话记录，可能不完整。', changedFiles: '修改文件', referencedFiles: '命令引用文件', noFiles: '未从会话记录中发现', copyPath: '复制路径',
          copied: '路径已复制', copyFailed: '无法访问剪贴板，请手动复制', unknownError: '未知错误',
          archiveFailed: (count, error) => `${count} 个会话归档失败：${error}`, archivedSuccess: '所选会话已归档',
          deleteHeading: count => `永久删除 ${count} 个会话？`, deleteDescription: 'Codex 会一并删除这些会话的派生会话和持久化元数据。此操作不可撤销。',
          deleteDanger: '项目文件不会被删除，但会话内容将无法从 Codex 恢复。', confirmationBefore: '输入 ', confirmationAfter: ' 继续', confirmation: '删除',
          cancel: '取消', confirmDelete: '确认永久删除', deleteFailed: (count, error) => `${count} 个会话删除失败：${error}`,
          sidebarSyncFailed: '会话已删除；侧边栏同步失败，请刷新或重启 Codex', deletedSuccess: '所选会话已永久删除，侧边栏已同步',
          tagLabels: { 'hidden-fork':'隐藏分叉', 'session-management':'会话管理', automation:'自动化', 'plugin-development':'插件开发', lark:'飞书协作', documents:'文档表格', media:'图像视频', development:'代码开发', general:'常规任务' }
        },
        en: {
          htmlLang: 'en', dateLocale: 'en-US', title: 'Codex Session Cleaner', languageSelector: 'Language', switchChinese: 'Switch to Chinese', switchEnglish: 'Switch to English',
          subtitle: 'Review project and file clues, then archive or permanently delete.', shield: '🔒 Current manager session is protected', toolbar: 'Session filters',
          search: 'Search title, ID, tag, or project path…', scopeActive: 'Current', scopeArchived: 'Archived', scopeAll: 'All',
          tag: 'Tag', tagAria: 'Filter by category tag', date: 'Date', dateAria: 'Filter by last updated date',
          withinDay: 'Within 1 day', withinWeek: 'Within 1 week', withinMonth: 'Within 1 month', older3Months: 'More than 3 months ago',
          olderMonth: 'More than 1 month ago', olderWeek: 'More than 1 week ago', custom: 'Custom range', refresh: 'Refresh',
          lastUpdated: 'Last updated', to: 'to', startDate: 'Start date', endDate: 'End date',
          archiveSelected: 'Archive selected', deleteSelected: 'Permanently delete selected',
          notice: 'Deleting sessions does not delete project files. The file list only contains change and reference clues extracted from session records; shared plugin caches, model caches, credentials, and global settings are outside this plugin’s scope.',
          requestTimeout: 'Request timed out', toolFailed: 'Tool call failed', requestFailed: 'Request failed', unknownTime: 'Unknown time',
          sessions: count => `${count} session${count === 1 ? '' : 's'}`, selected: count => `· ${count} selected`, loading: 'Loading sessions…', empty: 'No matching sessions',
          protected: 'Current manager session is protected', ephemeralProtected: 'Temporary sessions cannot be deleted', selectSession: 'Select session',
          busy: 'In use', busyHint: 'This session is open in Codex; archive or delete it from the sidebar',
          currentSession: 'Current session', archived: 'Archived', ephemeral: 'Temporary', unknownProject: 'Unknown project path',
          branch: value => `Branch ${value}`, descendants: count => `${count} derived session${count === 1 ? '' : 's'}`, blockers: count => `${count} referencing fork${count === 1 ? '' : 's'} block source deletion`, source: id => `Source ${id}`,
          collapseFiles: 'Hide files', inspectFiles: 'View files', copyProject: 'Copy project path', loadingFiles: 'Loading session file clues…',
          fileNote: 'File clues are extracted from session records and may be incomplete.', changedFiles: 'Changed files', referencedFiles: 'Files referenced by commands', noFiles: 'None found in session records', copyPath: 'Copy path',
          copied: 'Path copied', copyFailed: 'Clipboard unavailable; copy the path manually', unknownError: 'Unknown error',
          archiveFailed: (count, error) => `${count} session${count === 1 ? '' : 's'} failed to archive: ${error}`, archivedSuccess: 'Selected sessions archived',
          deleteHeading: count => `Permanently delete ${count} session${count === 1 ? '' : 's'}?`, deleteDescription: 'Codex will also delete derived sessions and persisted metadata. This action cannot be undone.',
          deleteDanger: 'Project files will not be deleted, but the session content cannot be recovered in Codex.', confirmationBefore: 'Type ', confirmationAfter: ' to continue', confirmation: 'delete',
          cancel: 'Cancel', confirmDelete: 'Confirm permanent deletion', deleteFailed: (count, error) => `${count} session${count === 1 ? '' : 's'} failed to delete: ${error}`,
          sidebarSyncFailed: 'Sessions deleted, but sidebar sync failed. Refresh or restart Codex.', deletedSuccess: 'Selected sessions permanently deleted and sidebar synced',
          tagLabels: { 'hidden-fork':'Hidden fork', 'session-management':'Session management', automation:'Automation', 'plugin-development':'Plugin development', lark:'Lark collaboration', documents:'Documents & sheets', media:'Images & video', development:'Code development', general:'General' }
        }
      };
      const localeFrom = value => String(value || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
      const state = { sessions: [], selected: new Set(), scope: 'all', search: '', tag: '', datePreset: 'all', customStart: '', customEnd: '', managerContext: '', files: new Map(), availableTags: [], loading: false, locale: localeFrom(navigator.language), localeMode: 'auto' };
      const pending = new Map();
      let rpcId = 1;
      const $ = id => document.getElementById(id);
      const t = () => I18N[state.locale];
      const tagLabel = tag => t().tagLabels[tag.key] || tag.label || tag.key;

      function setLocale(value, mode = 'auto') {
        if (mode !== 'manual' && state.localeMode === 'manual') return;
        const locale = localeFrom(value);
        if (mode === 'manual') state.localeMode = 'manual';
        if (state.locale === locale) { applyLocale(); return; }
        state.locale = locale;
        if ($('deleteDialog').open) { $('confirmation').value = ''; $('confirmDelete').disabled = true; }
        applyLocale();
        render();
      }

      function applyLocale() {
        const copy = t();
        document.documentElement.lang = copy.htmlLang; document.title = copy.title;
        $('languageSwitch').setAttribute('aria-label', copy.languageSelector);
        document.querySelectorAll('[data-locale]').forEach(button => {
          const active = button.dataset.locale === state.locale;
          button.classList.toggle('active', active); button.setAttribute('aria-pressed', String(active));
          button.title = button.dataset.locale === 'zh' ? copy.switchChinese : copy.switchEnglish;
        });
        $('pageTitle').textContent = copy.title; $('pageSubtitle').textContent = copy.subtitle; $('shield').textContent = copy.shield;
        $('toolbar').setAttribute('aria-label', copy.toolbar); $('search').placeholder = copy.search;
        const scopeLabels = { active:copy.scopeActive, archived:copy.scopeArchived, all:copy.scopeAll };
        document.querySelectorAll('[data-scope]').forEach(button => { button.textContent = scopeLabels[button.dataset.scope]; });
        $('tagFilter').setAttribute('aria-label', copy.tagAria); $('datePreset').setAttribute('aria-label', copy.dateAria);
        const dateLabels = { all:copy.date, within_1_day:copy.withinDay, within_1_week:copy.withinWeek, within_1_month:copy.withinMonth, older_than_3_months:copy.older3Months, older_than_1_month:copy.olderMonth, older_than_1_week:copy.olderWeek, custom:copy.custom };
        for (const option of $('datePreset').options) option.textContent = dateLabels[option.value];
        $('refresh').textContent = copy.refresh; $('customDates').children[0].textContent = copy.lastUpdated; $('customDates').children[2].textContent = copy.to;
        $('customStart').setAttribute('aria-label', copy.startDate); $('customEnd').setAttribute('aria-label', copy.endDate);
        $('archive').textContent = copy.archiveSelected; $('delete').textContent = copy.deleteSelected; $('notice').textContent = copy.notice;
        $('deleteDescription').textContent = copy.deleteDescription; $('deleteDanger').textContent = copy.deleteDanger;
        const strong = document.createElement('strong'); strong.textContent = copy.confirmation;
        $('confirmationLabel').replaceChildren(document.createTextNode(copy.confirmationBefore), strong, document.createTextNode(copy.confirmationAfter));
        $('confirmation').placeholder = copy.confirmation; $('cancelDelete').textContent = copy.cancel; $('confirmDelete').textContent = copy.confirmDelete;
        $('deleteHeading').textContent = copy.deleteHeading(visibleSelection().length);
        updateTagOptions(state.availableTags);
      }

      function request(method, params = {}) {
        const id = rpcId++;
        window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
          setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error(t().requestTimeout)); } }, 45000);
        });
      }

      async function tool(name, args = {}) {
        const argumentsWithContext = state.managerContext ? { ...args, managerContext: state.managerContext } : args;
        const result = await request('tools/call', { name, arguments: argumentsWithContext });
        if (result?.isError) throw new Error(result.content?.[0]?.text || t().toolFailed);
        return result?.structuredContent || result;
      }

      window.addEventListener('message', event => {
        // 请求只发往 window.parent，因此也只接受来自 window.parent 的消息。
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== '2.0') return;
        if (message.id && pending.has(message.id) && ('result' in message || 'error' in message)) {
          const job = pending.get(message.id); pending.delete(message.id);
          message.error ? job.reject(new Error(message.error.message || t().requestFailed)) : job.resolve(message.result);
          return;
        }
        if (message.method === 'ui/notifications/host-context-changed' || message.method === 'ui/notifications/host-context') {
          const locale = message.params?.locale || message.params?.language || message.params?.hostContext?.locale || message.params?.hostContext?.language;
          if (locale) setLocale(locale);
          return;
        }
        if (message.method === 'ui/notifications/tool-result') {
          const data = message.params?.structuredContent || message.params?.result?.structuredContent;
          if (data?.sessions) applySessions(data);
        }
      });

      function formatTime(value) {
        if (!value) return t().unknownTime;
        const number = Number(value);
        const date = new Date(number < 1e12 ? number * 1000 : number);
        return Number.isNaN(date.getTime()) ? t().unknownTime : new Intl.DateTimeFormat(t().dateLocale, { dateStyle:'medium', timeStyle:'short' }).format(date);
      }

      function timeMs(value) {
        const number = Number(value);
        if (!Number.isFinite(number) || number <= 0) return null;
        return number < 1e12 ? number * 1000 : number;
      }

      function monthsBefore(months) {
        const now = new Date();
        const day = now.getDate();
        const target = new Date(now);
        target.setDate(1);
        target.setMonth(target.getMonth() - months);
        const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
        target.setDate(Math.min(day, lastDay));
        return target.getTime();
      }

      function matchesDate(session) {
        if (state.datePreset === 'all') return true;
        const updatedAt = timeMs(session.updatedAt);
        if (updatedAt === null) return false;
        if (state.datePreset === 'within_1_day') return updatedAt >= Date.now() - 24 * 60 * 60 * 1000;
        if (state.datePreset === 'within_1_week') return updatedAt >= Date.now() - 7 * 24 * 60 * 60 * 1000;
        if (state.datePreset === 'within_1_month') return updatedAt >= monthsBefore(1);
        if (state.datePreset === 'older_than_3_months') return updatedAt < monthsBefore(3);
        if (state.datePreset === 'older_than_1_month') return updatedAt < monthsBefore(1);
        if (state.datePreset === 'older_than_1_week') return updatedAt < Date.now() - 7 * 24 * 60 * 60 * 1000;
        const start = state.customStart ? new Date(`${state.customStart}T00:00:00`).getTime() : null;
        const endDate = state.customEnd ? new Date(`${state.customEnd}T00:00:00`) : null;
        if (endDate) endDate.setDate(endDate.getDate() + 1);
        const end = endDate?.getTime() ?? null;
        if (start !== null && end !== null && start >= end) return false;
        if (start === null && end === null) return true;
        return (start === null || updatedAt >= start) && (end === null || updatedAt < end);
      }

      function showToast(text) {
        $('toast').textContent = text; $('toast').classList.add('show');
        setTimeout(() => $('toast').classList.remove('show'), 2800);
      }

      function filteredSessions() {
        const q = state.search.trim().toLowerCase();
        return state.sessions.filter(s => {
          if (state.scope !== 'all' && (state.scope === 'archived') !== Boolean(s.archived)) return false;
          if (!matchesDate(s)) return false;
          if (state.tag && !(s.tags || []).some(tag => tag.key === state.tag)) return false;
          const labels = (s.tags || []).flatMap(tag => [tag.label, tagLabel(tag)]);
          return !q || [s.title, s.preview, s.cwd, s.branch, s.id, s.historyBaseThreadId, ...labels].some(v => String(v || '').toLowerCase().includes(q));
        });
      }

      function visibleSelection(sessions = filteredSessions()) {
        return sessions.filter(session => state.selected.has(session.id) && session.deletable).map(session => session.id);
      }

      function updateTagOptions(availableTags) {
        const select = $('tagFilter');
        const tags = Array.isArray(availableTags) && availableTags.length
          ? availableTags
          : [...new Map(state.sessions.flatMap(session => session.tags || []).map(tag => [tag.key, tag])).values()];
        const current = state.tag;
        select.replaceChildren(new Option(t().tag, ''));
        for (const tag of tags) {
          const count = Number.isFinite(Number(tag.count)) ? ` · ${tag.count}` : '';
          select.append(new Option(`${tagLabel(tag)}${count}`, tag.key));
        }
        state.tag = tags.some(tag => tag.key === current) ? current : '';
        select.value = state.tag;
      }

      function applySessions(data) {
        if (typeof data.managerContext === 'string' && data.managerContext) state.managerContext = data.managerContext;
        if (data.locale && state.localeMode !== 'manual') state.locale = localeFrom(data.locale);
        state.sessions = Array.isArray(data.sessions) ? data.sessions : [];
        state.availableTags = Array.isArray(data.availableTags) ? data.availableTags : [];
        applyLocale();
        for (const id of [...state.selected]) if (!state.sessions.some(s => s.id === id && s.deletable)) state.selected.delete(id);
        render();
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function renderFiles(container, session) {
        const files = state.files.get(session.id);
        const box = el('div', 'files');
        if (files === 'loading') { box.textContent = t().loadingFiles; container.append(box); return; }
        if (files?.error) { box.textContent = files.error; container.append(box); return; }
        if (!files) return;
        const note = el('div', 'muted', t().fileNote); box.append(note);
        const groups = [[t().changedFiles, files.changedFiles || []], [t().referencedFiles, files.referencedFiles || []]];
        for (const [title, rows] of groups) {
          box.append(el('h4', '', `${title} · ${rows.length}`));
          if (!rows.length) box.append(el('div', 'muted', t().noFiles));
          for (const row of rows) {
            const line = el('div', 'file-row');
            line.append(el('span', 'path', row.path));
            const copy = el('button', 'link', t().copyPath);
            copy.type = 'button'; copy.addEventListener('click', () => copyText(row.path));
            line.append(copy); box.append(line);
          }
        }
        container.append(box);
      }

      function render() {
        const sessions = filteredSessions();
        const selection = visibleSelection(sessions);
        $('list').replaceChildren();
        $('count').textContent = t().sessions(sessions.length);
        $('selection').textContent = selection.length ? t().selected(selection.length) : '';
        $('archive').disabled = !selection.length || state.loading;
        $('delete').disabled = !selection.length || state.loading;
        if (!sessions.length) { $('list').append(el('div', 'empty', state.loading ? t().loading : t().empty)); return; }
        for (const session of sessions) {
          const card = el('article', `card${session.current ? ' current' : ''}`);
          const checkbox = document.createElement('input'); checkbox.type = 'checkbox';
          checkbox.checked = state.selected.has(session.id); checkbox.disabled = !session.deletable || state.loading;
          checkbox.title = session.busy ? t().busyHint : session.current || session.protected ? t().protected : session.ephemeral ? t().ephemeralProtected : t().selectSession;
          checkbox.addEventListener('change', () => { checkbox.checked ? state.selected.add(session.id) : state.selected.delete(session.id); render(); });
          card.append(checkbox);

          const body = el('div'); const titleRow = el('div', 'title-row'); titleRow.append(el('div', 'title', session.title));
          if (session.current) titleRow.append(el('span', 'badge current', t().currentSession));
          if (session.archived) titleRow.append(el('span', 'badge', t().archived));
          if (session.ephemeral) titleRow.append(el('span', 'badge', t().ephemeral));
          if (session.busy) { const b = el('span', 'badge warning', t().busy); b.title = t().busyHint; titleRow.append(b); }
          for (const tag of session.tags || []) titleRow.append(el('span', `badge${tag.key === 'hidden-fork' ? ' warning' : ''}`, tagLabel(tag)));
          body.append(titleRow);
          if (session.preview && session.preview !== session.title) body.append(el('div', 'preview', session.preview));
          const meta = el('div', 'meta');
          meta.append(el('span', 'path', session.cwd || t().unknownProject));
          if (session.branch) meta.append(el('span', '', t().branch(session.branch)));
          meta.append(el('span', '', formatTime(session.updatedAt)));
          if (session.descendantCount) meta.append(el('span', '', t().descendants(session.descendantCount)));
          if (session.blockingForkCount) meta.append(el('span', '', t().blockers(session.blockingForkCount)));
          if (session.historyBaseThreadId) meta.append(el('span', '', t().source(session.historyBaseThreadId)));
          body.append(meta); card.append(body);

          const side = el('div', 'side');
          const inspect = el('button', 'link', state.files.has(session.id) ? t().collapseFiles : t().inspectFiles); inspect.type = 'button';
          inspect.addEventListener('click', async () => {
            if (state.files.has(session.id)) { state.files.delete(session.id); render(); return; }
            state.files.set(session.id, 'loading'); render();
            try { state.files.set(session.id, await tool('inspect_session_files', { threadId: session.id })); }
            catch (error) { state.files.set(session.id, { error: error.message }); }
            render();
          });
          side.append(inspect);
          if (session.cwd) { const copy = el('button', 'link', t().copyProject); copy.type='button'; copy.addEventListener('click', () => copyText(session.cwd)); side.append(copy); }
          card.append(side); renderFiles(card, session); $('list').append(card);
        }
      }

      function copyTextWithSelection(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', 'true');
        textarea.style.position = 'fixed';
        textarea.style.left = '-10000px';
        textarea.style.top = '0';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus({ preventScroll: true });
        textarea.select();
        textarea.setSelectionRange(0, text.length);
        let copied = false;
        try { copied = document.execCommand('copy'); }
        catch { copied = false; }
        textarea.remove();
        return copied;
      }

      async function copyText(text) {
        // 选区复制必须在用户点击的同步调用栈内执行，否则受限 iframe 可能丢失用户手势。
        if (copyTextWithSelection(text)) {
          showToast(t().copied);
          return;
        }
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
            showToast(t().copied);
            return;
          }
        } catch {}
        showToast(t().copyFailed);
      }

      async function refresh() {
        state.loading = true; render();
        try { applySessions(await tool('list_sessions', { scope: 'all', search: '' })); }
        catch (error) { showToast(error.message); }
        finally { state.loading = false; render(); }
      }

      async function archiveSelected() {
        const targets = visibleSelection();
        if (!targets.length) return;
        state.loading = true; render();
        try {
          const data = await tool('archive_sessions', { threadIds: targets });
          const failed = (data.results || []).filter(r => !r.ok);
          showToast(failed.length ? t().archiveFailed(failed.length, failed[0].error || t().unknownError) : t().archivedSuccess);
          state.selected.clear(); await refresh();
        } catch (error) { showToast(error.message); }
        finally { state.loading = false; render(); }
      }

      function openDelete() {
        const targets = visibleSelection();
        if (!targets.length) return;
        $('deleteHeading').textContent = t().deleteHeading(targets.length); $('confirmation').value = ''; $('confirmDelete').disabled = true;
        $('deleteDialog').showModal(); setTimeout(() => $('confirmation').focus(), 30);
      }

      async function performDelete(event) {
        event.preventDefault();
        if ($('confirmation').value !== t().confirmation) return;
        const targets = visibleSelection();
        $('deleteDialog').close();
        if (!targets.length) return;
        state.loading = true; render();
        try {
          const data = await tool('delete_sessions', { threadIds: targets, confirmation: t().confirmation });
          const failed = (data.results || []).filter(r => !r.ok);
          const syncFailed = data.sidebarSync && !data.sidebarSync.ok;
          showToast(failed.length ? t().deleteFailed(failed.length, failed[0].error || t().unknownError) : syncFailed ? t().sidebarSyncFailed : t().deletedSuccess);
          state.selected.clear(); await refresh();
        } catch (error) { showToast(error.message); }
        finally { state.loading = false; render(); }
      }

      $('search').addEventListener('input', event => { state.search = event.target.value; state.selected.clear(); render(); });
      $('tagFilter').addEventListener('change', event => { state.tag = event.target.value; state.selected.clear(); render(); });
      $('datePreset').addEventListener('change', event => {
        state.datePreset = event.target.value;
        state.selected.clear();
        $('customDates').hidden = state.datePreset !== 'custom';
        render();
      });
      $('customStart').addEventListener('change', event => { state.customStart = event.target.value; state.selected.clear(); render(); });
      $('customEnd').addEventListener('change', event => { state.customEnd = event.target.value; state.selected.clear(); render(); });
      document.querySelectorAll('[data-scope]').forEach(button => button.addEventListener('click', () => {
        state.scope = button.dataset.scope; state.selected.clear();
        document.querySelectorAll('[data-scope]').forEach(b => b.classList.toggle('active', b === button)); render();
      }));
      document.querySelectorAll('[data-locale]').forEach(button => button.addEventListener('click', () => setLocale(button.dataset.locale, 'manual')));
      $('refresh').addEventListener('click', refresh);
      $('archive').addEventListener('click', archiveSelected);
      $('delete').addEventListener('click', openDelete);
      $('cancelDelete').addEventListener('click', () => $('deleteDialog').close());
      $('confirmation').addEventListener('input', event => { $('confirmDelete').disabled = event.target.value !== t().confirmation; });
      $('deleteForm').addEventListener('submit', performDelete);

      applyLocale(); render();
      setTimeout(() => { if (!state.sessions.length) refresh(); }, 500);
    })();
  </script>
</body>
</html>
