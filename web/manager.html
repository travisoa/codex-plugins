<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex 会话清理器</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f5f7; --panel:rgba(255,255,255,.88); --text:#17191d; --muted:#6e737b; --line:rgba(23,25,29,.11); --accent:#1677ff; --danger:#d92d20; --danger-bg:#fff0ee; --shadow:0 14px 36px rgba(24,30,42,.10); }
    @media (prefers-color-scheme:dark) { :root { --bg:#17181a; --panel:rgba(34,35,38,.9); --text:#f5f6f7; --muted:#a7abb1; --line:rgba(255,255,255,.12); --danger-bg:#421c1a; --shadow:0 14px 36px rgba(0,0,0,.28); } }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 20% 0%,rgba(22,119,255,.11),transparent 30%),var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif; }
    button,input,select { font:inherit; }
    button { color:inherit; }
    .app { max-width:1060px; margin:0 auto; padding:24px 18px 40px; }
    header { display:flex; gap:16px; align-items:flex-start; justify-content:space-between; margin-bottom:18px; }
    h1 { font-size:25px; letter-spacing:-.02em; margin:0 0 4px; }
    .subtitle,.muted { color:var(--muted); }
    .shield { border:1px solid var(--line); background:var(--panel); padding:7px 10px; border-radius:999px; white-space:nowrap; }
    .toolbar { position:sticky; top:0; z-index:3; display:grid; grid-template-columns:minmax(160px,1fr) auto auto auto; gap:10px; padding:12px; border:1px solid var(--line); border-radius:16px; background:var(--panel); backdrop-filter:blur(18px); box-shadow:var(--shadow); }
    .search,.date-select,.date-input { border:1px solid var(--line); background:transparent; color:var(--text); border-radius:10px; padding:9px 11px; outline:none; }
    .search:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(22,119,255,.13); }
    .segments { display:flex; padding:3px; border:1px solid var(--line); border-radius:11px; }
    .segments button { border:0; background:transparent; border-radius:8px; padding:6px 10px; cursor:pointer; }
    .segments button.active { background:var(--text); color:var(--bg); }
    .date-select { min-width:150px; cursor:pointer; }
    .custom-dates { grid-column:1 / -1; display:flex; align-items:center; justify-content:flex-end; gap:8px; padding-top:2px; color:var(--muted); }
    .custom-dates[hidden] { display:none; }
    .btn { border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:8px 11px; cursor:pointer; }
    .btn:hover:not(:disabled) { border-color:rgba(22,119,255,.5); }
    .btn:disabled { opacity:.42; cursor:not-allowed; }
    .btn.danger { color:var(--danger); border-color:rgba(217,45,32,.3); background:var(--danger-bg); }
    .summary { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:16px 3px 9px; }
    .actions { display:flex; gap:8px; align-items:center; }
    .list { display:grid; gap:10px; }
    .card { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:flex-start; padding:15px; border:1px solid var(--line); border-radius:15px; background:var(--panel); box-shadow:0 5px 18px rgba(20,25,34,.04); }
    .card:hover { border-color:rgba(22,119,255,.28); }
    .card.current { box-shadow:inset 3px 0 0 var(--accent); }
    .card input[type=checkbox] { width:17px; height:17px; margin-top:3px; accent-color:var(--accent); }
    .title-row { display:flex; align-items:center; gap:7px; min-width:0; }
    .title { font-size:15px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .badge { display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:999px; padding:1px 7px; font-size:11px; color:var(--muted); white-space:nowrap; }
    .badge.current { color:var(--accent); border-color:rgba(22,119,255,.35); }
    .preview { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px; }
    .meta { display:flex; flex-wrap:wrap; gap:6px 13px; margin-top:9px; color:var(--muted); font-size:12px; }
    .path { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
    .side { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
    .link { border:0; background:transparent; color:var(--accent); padding:2px; cursor:pointer; }
    .files { grid-column:2 / 4; border-top:1px solid var(--line); padding-top:11px; }
    .files h4 { margin:8px 0 5px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    .file-row { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line); }
    .empty { text-align:center; padding:52px 16px; color:var(--muted); border:1px dashed var(--line); border-radius:15px; }
    .notice { margin-top:13px; padding:10px 12px; color:var(--muted); border:1px solid var(--line); border-radius:11px; }
    .toast { position:fixed; right:18px; bottom:18px; max-width:400px; z-index:20; padding:11px 14px; border-radius:11px; background:var(--text); color:var(--bg); box-shadow:var(--shadow); opacity:0; transform:translateY(10px); pointer-events:none; transition:.18s ease; }
    .toast.show { opacity:1; transform:translateY(0); }
    dialog { width:min(520px,calc(100vw - 28px)); border:1px solid var(--line); border-radius:18px; padding:0; color:var(--text); background:var(--panel); box-shadow:0 26px 90px rgba(0,0,0,.35); }
    dialog::backdrop { background:rgba(0,0,0,.46); backdrop-filter:blur(3px); }
    .modal { padding:20px; }
    .modal h2 { margin:0 0 6px; font-size:19px; }
    .danger-box { margin:14px 0; border:1px solid rgba(217,45,32,.28); background:var(--danger-bg); border-radius:11px; padding:10px 12px; color:var(--danger); }
    .confirm { width:100%; color:var(--text); background:transparent; border:1px solid var(--line); border-radius:10px; padding:10px; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
    @media (max-width:720px) { .toolbar { grid-template-columns:1fr; position:static; } header { flex-direction:column; } .summary { align-items:flex-start; flex-direction:column; } .card { grid-template-columns:auto minmax(0,1fr); } .side { grid-column:2; align-items:flex-start; flex-direction:row; } .files { grid-column:2; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div><h1>Codex 会话清理器</h1><div class="subtitle">看清项目与文件线索，再归档或永久删除。</div></div>
      <div class="shield">🔒 当前管理会话受保护</div>
    </header>
    <section class="toolbar" aria-label="会话筛选">
      <input id="search" class="search" type="search" placeholder="搜索会话标题或本页项目路径…">
      <div class="segments" role="tablist">
        <button data-scope="active">当前</button><button data-scope="archived">已归档</button><button data-scope="all" class="active">全部</button>
      </div>
      <select id="datePreset" class="date-select" aria-label="按最后更新时间筛选">
        <option value="all">全部日期</option>
        <option value="older_than_3_months">3 个月前（更早）</option>
        <option value="older_than_1_month">1 个月前（更早）</option>
        <option value="older_than_1_week">1 周前（更早）</option>
        <option value="custom">自定义日期</option>
      </select>
      <button id="refresh" class="btn">刷新</button>
      <div id="customDates" class="custom-dates" hidden>
        <span>最后更新时间</span>
        <input id="customStart" class="date-input" type="date" aria-label="开始日期">
        <span>至</span>
        <input id="customEnd" class="date-input" type="date" aria-label="结束日期">
      </div>
    </section>
    <div class="summary">
      <div><span id="count">正在读取…</span> <span id="selection" class="muted"></span></div>
      <div class="actions">
        <button id="archive" class="btn" disabled>归档所选</button>
        <button id="delete" class="btn danger" disabled>永久删除所选</button>
      </div>
    </div>
    <section id="list" class="list" aria-live="polite"></section>
    <div class="notice">删除会话不会删除项目文件。文件列表只是从会话记录提取的修改/引用线索；共享插件缓存、模型缓存、认证信息和全局配置不在本插件清理范围内。</div>
  </main>

  <dialog id="deleteDialog">
    <form method="dialog" class="modal" id="deleteForm">
      <h2>永久删除 <span id="deleteCount"></span> 个会话？</h2>
      <div class="muted">Codex 会一并删除这些会话的派生会话和持久化元数据。此操作不可撤销。</div>
      <div class="danger-box">项目文件不会被删除，但会话内容将无法从 Codex 恢复。</div>
      <label for="confirmation">输入 <strong>永久删除</strong> 继续</label>
      <input id="confirmation" class="confirm" autocomplete="off" placeholder="永久删除">
      <div class="modal-actions">
        <button value="cancel" class="btn">取消</button>
        <button id="confirmDelete" value="default" class="btn danger" disabled>确认永久删除</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>

  <script>
    (() => {
      const state = { sessions: [], selected: new Set(), scope: 'all', search: '', datePreset: 'all', customStart: '', customEnd: '', files: new Map(), loading: false };
      const pending = new Map();
      let rpcId = 1;
      const $ = id => document.getElementById(id);

      function request(method, params = {}) {
        const id = rpcId++;
        window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
          setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error('请求超时')); } }, 45000);
        });
      }

      async function tool(name, args = {}) {
        const result = await request('tools/call', { name, arguments: args });
        if (result?.isError) throw new Error(result.content?.[0]?.text || '工具调用失败');
        return result?.structuredContent || result;
      }

      window.addEventListener('message', event => {
        const message = event.data;
        if (!message || message.jsonrpc !== '2.0') return;
        if (message.id && pending.has(message.id)) {
          const job = pending.get(message.id); pending.delete(message.id);
          message.error ? job.reject(new Error(message.error.message || '请求失败')) : job.resolve(message.result);
          return;
        }
        if (message.method === 'ui/notifications/tool-result') {
          const data = message.params?.structuredContent || message.params?.result?.structuredContent;
          if (data?.sessions) applySessions(data);
        }
      });

      function formatTime(value) {
        if (!value) return '时间未知';
        const number = Number(value);
        const date = new Date(number < 1e12 ? number * 1000 : number);
        return Number.isNaN(date.getTime()) ? '时间未知' : new Intl.DateTimeFormat('zh-CN', { dateStyle:'medium', timeStyle:'short' }).format(date);
      }

      function timeMs(value) {
        const number = Number(value);
        if (!Number.isFinite(number) || number <= 0) return null;
        return number < 1e12 ? number * 1000 : number;
      }

      function monthsBefore(months) {
        const now = new Date();
        const day = now.getDate();
        const target = new Date(now);
        target.setDate(1);
        target.setMonth(target.getMonth() - months);
        const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
        target.setDate(Math.min(day, lastDay));
        return target.getTime();
      }

      function matchesDate(session) {
        if (state.datePreset === 'all') return true;
        const updatedAt = timeMs(session.updatedAt);
        if (updatedAt === null) return false;
        if (state.datePreset === 'older_than_3_months') return updatedAt < monthsBefore(3);
        if (state.datePreset === 'older_than_1_month') return updatedAt < monthsBefore(1);
        if (state.datePreset === 'older_than_1_week') return updatedAt < Date.now() - 7 * 24 * 60 * 60 * 1000;
        const start = state.customStart ? new Date(`${state.customStart}T00:00:00`).getTime() : null;
        const endDate = state.customEnd ? new Date(`${state.customEnd}T00:00:00`) : null;
        if (endDate) endDate.setDate(endDate.getDate() + 1);
        const end = endDate?.getTime() ?? null;
        if (start !== null && end !== null && start >= end) return false;
        if (start === null && end === null) return true;
        return (start === null || updatedAt >= start) && (end === null || updatedAt < end);
      }

      function showToast(text) {
        $('toast').textContent = text; $('toast').classList.add('show');
        setTimeout(() => $('toast').classList.remove('show'), 2800);
      }

      function filteredSessions() {
        const q = state.search.trim().toLowerCase();
        return state.sessions.filter(s => {
          if (state.scope !== 'all' && (state.scope === 'archived') !== Boolean(s.archived)) return false;
          if (!matchesDate(s)) return false;
          return !q || [s.title, s.preview, s.cwd, s.branch, s.id].some(v => String(v || '').toLowerCase().includes(q));
        });
      }

      function applySessions(data) {
        state.sessions = Array.isArray(data.sessions) ? data.sessions : [];
        for (const id of [...state.selected]) if (!state.sessions.some(s => s.id === id && s.deletable)) state.selected.delete(id);
        render();
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function renderFiles(container, session) {
        const files = state.files.get(session.id);
        const box = el('div', 'files');
        if (files === 'loading') { box.textContent = '正在读取会话文件线索…'; container.append(box); return; }
        if (files?.error) { box.textContent = files.error; container.append(box); return; }
        if (!files) return;
        const note = el('div', 'muted', files.note); box.append(note);
        const groups = [['修改文件', files.changedFiles || []], ['命令引用文件', files.referencedFiles || []]];
        for (const [title, rows] of groups) {
          box.append(el('h4', '', `${title} · ${rows.length}`));
          if (!rows.length) box.append(el('div', 'muted', '未从会话记录中发现'));
          for (const row of rows) {
            const line = el('div', 'file-row');
            line.append(el('span', 'path', row.path));
            const copy = el('button', 'link', '复制路径');
            copy.type = 'button'; copy.addEventListener('click', () => copyText(row.path));
            line.append(copy); box.append(line);
          }
        }
        container.append(box);
      }

      function render() {
        const sessions = filteredSessions();
        $('list').replaceChildren();
        $('count').textContent = `${sessions.length} 个会话`;
        $('selection').textContent = state.selected.size ? `· 已选 ${state.selected.size}` : '';
        $('archive').disabled = !state.selected.size || state.loading;
        $('delete').disabled = !state.selected.size || state.loading;
        if (!sessions.length) { $('list').append(el('div', 'empty', state.loading ? '正在读取会话…' : '没有符合条件的会话')); return; }
        for (const session of sessions) {
          const card = el('article', `card${session.current ? ' current' : ''}`);
          const checkbox = document.createElement('input'); checkbox.type = 'checkbox';
          checkbox.checked = state.selected.has(session.id); checkbox.disabled = !session.deletable || state.loading;
          checkbox.title = session.current || session.protected ? '当前管理会话受保护' : session.ephemeral ? '临时会话不可删除' : '选择会话';
          checkbox.addEventListener('change', () => { checkbox.checked ? state.selected.add(session.id) : state.selected.delete(session.id); render(); });
          card.append(checkbox);

          const body = el('div'); const titleRow = el('div', 'title-row'); titleRow.append(el('div', 'title', session.title));
          if (session.current) titleRow.append(el('span', 'badge current', '当前会话'));
          if (session.archived) titleRow.append(el('span', 'badge', '已归档'));
          if (session.ephemeral) titleRow.append(el('span', 'badge', '临时'));
          body.append(titleRow);
          if (session.preview && session.preview !== session.title) body.append(el('div', 'preview', session.preview));
          const meta = el('div', 'meta');
          meta.append(el('span', 'path', session.cwd || '项目路径未知'));
          if (session.branch) meta.append(el('span', '', `分支 ${session.branch}`));
          meta.append(el('span', '', formatTime(session.updatedAt)));
          if (session.descendantCount) meta.append(el('span', '', `${session.descendantCount} 个派生会话`));
          body.append(meta); card.append(body);

          const side = el('div', 'side');
          const inspect = el('button', 'link', state.files.has(session.id) ? '收起文件' : '查看文件'); inspect.type = 'button';
          inspect.addEventListener('click', async () => {
            if (state.files.has(session.id)) { state.files.delete(session.id); render(); return; }
            state.files.set(session.id, 'loading'); render();
            try { state.files.set(session.id, await tool('inspect_session_files', { threadId: session.id })); }
            catch (error) { state.files.set(session.id, { error: error.message }); }
            render();
          });
          side.append(inspect);
          if (session.cwd) { const copy = el('button', 'link', '复制项目路径'); copy.type='button'; copy.addEventListener('click', () => copyText(session.cwd)); side.append(copy); }
          card.append(side); renderFiles(card, session); $('list').append(card);
        }
      }

      function copyTextWithSelection(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', 'true');
        textarea.style.position = 'fixed';
        textarea.style.left = '-10000px';
        textarea.style.top = '0';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus({ preventScroll: true });
        textarea.select();
        textarea.setSelectionRange(0, text.length);
        let copied = false;
        try { copied = document.execCommand('copy'); }
        catch { copied = false; }
        textarea.remove();
        return copied;
      }

      async function copyText(text) {
        // 选区复制必须在用户点击的同步调用栈内执行，否则受限 iframe 可能丢失用户手势。
        if (copyTextWithSelection(text)) {
          showToast('路径已复制');
          return;
        }
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
            showToast('路径已复制');
            return;
          }
        } catch {}
        showToast('无法访问剪贴板，请手动复制');
      }

      async function refresh() {
        state.loading = true; render();
        try { applySessions(await tool('list_sessions', { scope: 'all', search: '' })); }
        catch (error) { showToast(error.message); }
        finally { state.loading = false; render(); }
      }

      async function archiveSelected() {
        if (!state.selected.size) return;
        state.loading = true; render();
        try {
          const data = await tool('archive_sessions', { threadIds: [...state.selected] });
          const failed = (data.results || []).filter(r => !r.ok);
          showToast(failed.length ? `${failed.length} 个会话归档失败` : '所选会话已归档');
          state.selected.clear(); await refresh();
        } catch (error) { showToast(error.message); }
        finally { state.loading = false; render(); }
      }

      function openDelete() {
        $('deleteCount').textContent = state.selected.size; $('confirmation').value = ''; $('confirmDelete').disabled = true;
        $('deleteDialog').showModal(); setTimeout(() => $('confirmation').focus(), 30);
      }

      async function performDelete(event) {
        event.preventDefault();
        if ($('confirmation').value !== '永久删除') return;
        $('deleteDialog').close(); state.loading = true; render();
        try {
          const data = await tool('delete_sessions', { threadIds: [...state.selected], confirmation: '永久删除' });
          const failed = (data.results || []).filter(r => !r.ok);
          const syncFailed = data.sidebarSync && !data.sidebarSync.ok;
          showToast(failed.length ? `${failed.length} 个会话删除失败` : syncFailed ? '会话已删除；侧边栏同步失败，请刷新或重启 Codex' : '所选会话已永久删除，侧边栏已同步');
          state.selected.clear(); await refresh();
        } catch (error) { showToast(error.message); }
        finally { state.loading = false; render(); }
      }

      $('search').addEventListener('input', event => { state.search = event.target.value; render(); });
      $('datePreset').addEventListener('change', event => {
        state.datePreset = event.target.value;
        state.selected.clear();
        $('customDates').hidden = state.datePreset !== 'custom';
        render();
      });
      $('customStart').addEventListener('change', event => { state.customStart = event.target.value; state.selected.clear(); render(); });
      $('customEnd').addEventListener('change', event => { state.customEnd = event.target.value; state.selected.clear(); render(); });
      document.querySelectorAll('[data-scope]').forEach(button => button.addEventListener('click', () => {
        state.scope = button.dataset.scope; document.querySelectorAll('[data-scope]').forEach(b => b.classList.toggle('active', b === button)); render();
      }));
      $('refresh').addEventListener('click', refresh);
      $('archive').addEventListener('click', archiveSelected);
      $('delete').addEventListener('click', openDelete);
      $('confirmation').addEventListener('input', event => { $('confirmDelete').disabled = event.target.value !== '永久删除'; });
      $('deleteForm').addEventListener('submit', performDelete);

      render();
      setTimeout(() => { if (!state.sessions.length) refresh(); }, 500);
    })();
  </script>
</body>
</html>
